# YojanaAI — streamlit app + fastapi backend as separate services
services:
  web:
    build: .
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    environment: &env
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-serviceAccountKey.json}
      BHASHINI_API_KEY: ${BHASHINI_API_KEY:-}
      BHASHINI_USER_ID: ${BHASHINI_USER_ID:-}
    volumes:
      - ./serviceAccountKey.json:/app/serviceAccountKey.json:ro
      - ./seed_data:/app/seed_data:ro
    restart: unless-stopped

  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment: *env
    volumes:
      - ./serviceAccountKey.json:/app/serviceAccountKey.json:ro
    restart: unless-stopped

volumes: {}